name: Deploy

# Continuous deployment for all three apps: the NestJS backend (api.roombazar.com)
# and the two Next.js apps (public frontend www.roombazar.com + managing).
#
# This runs only after a commit lands on `main` — i.e. after a pull request has
# passed the CI workflow and been merged. It never runs on feature branches.
#
# It is a no-op for any target whose secrets are unset, so merging this workflow
# cannot break anything on its own. Each job SKIPS (not fails) when unconfigured.
#
# The backend job exists specifically because the backend NOT redeploying while
# the frontend did is what broke the Phase 2 sitemap: the frontend shipped code
# that calls `${NEXT_PUBLIC_API_URL}/api/sitemap/listings`, but that route was
# only in the (undeployed) backend build.
#
# Required repository secrets / variables (Settings → Secrets and variables → Actions):
#   Backend
#     BACKEND_DEPLOY_HOOK_URL   - deploy-hook URL for the backend host
#                                 (Render / Railway / Coolify / etc. all provide one)
#   Frontend + managing (Vercel)
#     VERCEL_TOKEN              - Vercel access token
#     VERCEL_ORG_ID             - Vercel organisation id
#     VERCEL_PROJECT_ID_FRONTEND / VERCEL_PROJECT_ID_MANAGING - Vercel project ids
#     NEXT_PUBLIC_SITE_URL      - https://www.roombazar.com          (Actions *variable*)
#     NEXT_PUBLIC_API_URL       - https://api.roombazar.com          (Actions *variable*)
#     NEXT_PUBLIC_IMAGE_HOST    - listing image host (matches next.config.ts)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Check deploy config
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      managing: ${{ steps.check.outputs.managing }}
    steps:
      - id: check
        env:
          BACKEND_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FRONTEND_PROJECT: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          MANAGING_PROJECT: ${{ secrets.VERCEL_PROJECT_ID_MANAGING }}
        run: |
          if [ -n "$BACKEND_HOOK" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BACKEND_DEPLOY_HOOK_URL not set — skipping backend deploy."
          fi
          if [ -n "$TOKEN" ] && [ -n "$FRONTEND_PROJECT" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN / VERCEL_PROJECT_ID_FRONTEND not set — skipping frontend deploy."
          fi
          if [ -n "$TOKEN" ] && [ -n "$MANAGING_PROJECT" ]; then
            echo "managing=true" >> "$GITHUB_OUTPUT"
          else
            echo "managing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN / VERCEL_PROJECT_ID_MANAGING not set — skipping managing deploy."
          fi

  backend:
    name: Deploy backend
    needs: guard
    if: needs.guard.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy hook
        env:
          HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering backend deploy for ${{ github.sha }}"
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$HOOK")
          echo "Deploy hook responded HTTP $code"
          case "$code" in
            2*) echo "Backend deploy triggered." ;;
            *) echo "::error::Backend deploy hook failed (HTTP $code)"; exit 1 ;;
          esac

  frontend:
    name: Deploy frontend
    # Deploy the frontend only after the backend deploy has succeeded or been
    # skipped — never while a backend deploy is failing. This is the ordering
    # guarantee that the Phase 2 sitemap incident needed.
    needs: [guard, backend]
    if: >-
      always()
      && needs.guard.outputs.frontend == 'true'
      && needs.backend.result != 'failure'
      && needs.backend.result != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_IMAGE_HOST: ${{ vars.NEXT_PUBLIC_IMAGE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  managing:
    name: Deploy managing app
    needs: [guard, backend]
    if: >-
      always()
      && needs.guard.outputs.managing == 'true'
      && needs.backend.result != 'failure'
      && needs.backend.result != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: managing
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_MANAGING }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: managing/package-lock.json
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
